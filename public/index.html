<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <title>Rocket</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #0e1621; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #app { width: 100%; max-width: 500px; height: 700px; background: #17212b; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
    #login-screen, #chat-screen { display: none; flex-direction: column; height: 100%; }
    #login-screen.active, #chat-screen.active { display: flex; }

    /* Логин */
    #login-screen { justify-content: center; align-items: center; padding: 20px; }
    #login-screen .container { background: #1e2a36; padding: 30px; border-radius: 16px; width: 100%; max-width: 300px; }
    #login-screen input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; background: #2b3b4a; color: #fff; }
    #login-screen button { width: 100%; padding: 12px; background: #2b5278; color: #fff; border: none; border-radius: 8px; cursor: pointer; margin-top: 5px; }
    #login-screen button:hover { background: #3a6b94; }
    #login-message { margin-top: 10px; color: #7e9bb5; text-align: center; }

    /* Шапка чата */
    #header { background: #1e2a36; padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2b3b4a; }
    #header span { font-weight: bold; }
    #logout { background: #2b5278; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; }

    /* Список чатов */
    #chat-list { flex: 1; padding: 12px; overflow-y: auto; }
    .chat-item { padding: 14px; background: #1e2a36; border-radius: 12px; margin-bottom: 10px; cursor: pointer; border-left: 4px solid #2b5278; }
    .chat-item:hover { background: #253544; }

    /* Окно сообщений */
    #messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #17212b; }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 16px; word-wrap: break-word; font-size: 15px; }
    .msg.sent { align-self: flex-end; background: #2b5278; color: #fff; border-bottom-right-radius: 4px; }
    .msg.received { align-self: flex-start; background: #1e2a36; color: #e0e0e0; border-bottom-left-radius: 4px; }
    .msg .time { font-size: 11px; opacity: 0.6; margin-top: 4px; text-align: right; }

    /* Поле ввода */
    #footer { display: flex; padding: 10px; background: #1e2a36; border-top: 1px solid #2b3b4a; gap: 8px; }
    #input { flex: 1; padding: 12px; border: none; border-radius: 20px; background: #2b3b4a; color: #fff; font-size: 15px; outline: none; }
    #input::placeholder { color: #7e9bb5; }
    #send { background: #2b5278; color: #fff; border: none; border-radius: 20px; padding: 12px 20px; font-weight: bold; cursor: pointer; }
    #send:hover { background: #3a6b94; }

    .hidden { display: none !important; }
    #typingIndicator { padding: 5px 12px; color: #7e9bb5; font-size: 14px; font-style: italic; min-height: 24px; }
  </style>
</head>
<body>
<div id="app">
  <!-- Экран входа -->
  <div id="login-screen" class="active">
    <div class="container">
      <h2>🔐 Вход / Регистрация</h2>
      <input type="text" id="login-username" placeholder="Логин">
      <input type="password" id="login-password" placeholder="Пароль">
      <button id="login-btn">Войти</button>
      <button id="register-btn">Зарегистрироваться</button>
      <div id="login-message"></div>
    </div>
  </div>

  <!-- Экран чата -->
  <div id="chat-screen">
    <div id="header">
      <span id="chat-title">Мой Мессенджер</span>
      <button id="logout">Выйти</button>
    </div>

    <!-- Список чатов -->
    <div id="chat-list">
      <div class="chat-item" data-chat="1">👤 Алексей</div>
      <div class="chat-item" data-chat="2">👤 Марина</div>
      <div class="chat-item" data-chat="3">👤 Денис</div>
    </div>

    <!-- Окно сообщений -->
    <div id="messages" class="hidden"></div>

    <!-- Индикатор печати -->
    <div id="typingIndicator"></div>

    <!-- Поле ввода -->
    <div id="footer" class="hidden">
      <input type="file" id="fileInput" style="display:none;">
      <button id="attachBtn">📎</button>
      <input id="input" placeholder="Введите сообщение...">
      <button id="send">➤</button>
    </div>
  </div>
</div>

<script>
// === ЛОГИКА МЕССЕНДЖЕРА ===
const loginScreen = document.getElementById('login-screen');
const chatScreen = document.getElementById('chat-screen');
const loginUsername = document.getElementById('login-username');
const loginPassword = document.getElementById('login-password');
const loginBtn = document.getElementById('login-btn');
const registerBtn = document.getElementById('register-btn');
const loginMessage = document.getElementById('login-message');

const chatList = document.getElementById('chat-list');
const messagesDiv = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const logoutBtn = document.getElementById('logout');
const chatTitle = document.getElementById('chat-title');
const typingIndicator = document.getElementById('typingIndicator');

let currentUser = null;
let currentChat = null;
const chatMessages = {};
let ws = null;

// === ФОРМАТИРОВАНИЕ ДАТЫ ===
function formatMessageDate(timestamp) {
  const date = new Date(timestamp);
  const now = new Date();
  const diff = now - date;

  if (diff < 24 * 60 * 60 * 1000) return 'сегодня';
  if (diff < 48 * 60 * 60 * 1000) return 'вчера';
  return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
}

// === ПОДКЛЮЧЕНИЕ WEBSOCKET ===
function connectWebSocket() {
  ws = new WebSocket('wss://' + window.location.host);
  ws.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      if (data.type === 'typing') {
        typingIndicator.textContent = `${data.user} печатает...`;
        clearTimeout(window.typingTimeout);
        window.typingTimeout = setTimeout(() => {
          typingIndicator.textContent = '';
        }, 2000);
      }
    } catch (e) {
      console.error('WebSocket error:', e);
    }
  };
}

// === СТАРТОВЫЕ СООБЩЕНИЯ ===
chatMessages['1'] = [{ sender: 'received', text: 'Привет! Как дела?', timestamp: new Date(Date.now() - 60000).toISOString() }];
chatMessages['2'] = [{ sender: 'received', text: 'Ты сегодня на встречу?', timestamp: new Date(Date.now() - 120000).toISOString() }];
chatMessages['3'] = [{ sender: 'sent', text: 'Скинь документ', timestamp: new Date(Date.now() - 180000).toISOString() }];

// === ВХОД ===
loginBtn.onclick = async () => {
  const user = loginUsername.value.trim();
  const pass = loginPassword.value.trim();
  if (!user || !pass) {
    loginMessage.textContent = 'Введите логин и пароль';
    return;
  }
  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass })
    });
    const data = await res.json();
    if (data.success) {
      currentUser = user;
      loginMessage.textContent = '';
      loginScreen.classList.remove('active');
      chatScreen.classList.add('active');
      chatTitle.textContent = `👤 ${user}`;
      connectWebSocket();
    } else {
      loginMessage.textContent = data.error || 'Ошибка входа';
    }
  } catch {
    loginMessage.textContent = 'Сервер не отвечает';
  }
};

// === РЕГИСТРАЦИЯ ===
registerBtn.onclick = async () => {
  const user = loginUsername.value.trim();
  const pass = loginPassword.value.trim();
  if (!user || !pass) {
    loginMessage.textContent = 'Введите логин и пароль';
    return;
  }
  try {
    const res = await fetch('/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass })
    });
    const data = await res.json();
    loginMessage.textContent = data.message || data.error;
  } catch {
    loginMessage.textContent = 'Сервер не отвечает';
  }
};

// === ОТКРЫТЬ ЧАТ ===
function openChat(chatId, chatName) {
  currentChat = chatId;
  chatTitle.textContent = chatName;
  chatList.classList.add('hidden');
  messagesDiv.classList.remove('hidden');
  document.getElementById('footer').classList.remove('hidden');
  renderMessages(chatId);
  input.focus();
}

// === РЕНДЕР СООБЩЕНИЙ ===
function renderMessages(chatId) {
  messagesDiv.innerHTML = '';
  const msgs = chatMessages[chatId] || [];
  msgs.forEach(msg => {
    const div = document.createElement('div');
    const isSent = msg.sender === 'sent' || msg.sender === currentUser;
    div.className = `msg ${isSent ? 'sent' : 'received'}`;
    
    const dateStr = formatMessageDate(msg.timestamp);
    const timeStr = new Date(msg.timestamp).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    
    let content = msg.text;
    if (msg.fileUrl) {
      content = `<a href="${msg.fileUrl}" target="_blank" style="color:#2b5278;">📎 Файл</a>`;
    }
    
    div.innerHTML = `${content} <div class="time">${dateStr} ${timeStr}</div>`;
    messagesDiv.appendChild(div);
  });
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

// === ОТПРАВКА СООБЩЕНИЯ ===
async function sendMessage(text, isFile = false) {
  if (!text || !currentChat) return;
  
  const msg = {
    chatId: currentChat,
    sender: currentUser,
    text: isFile ? '📎 Файл' : text,
    fileUrl: isFile ? text : null,
    timestamp: new Date().toISOString()
  };
  
  try {
    const res = await fetch('/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(msg)
    });
    const savedMsg = await res.json();
    if (!chatMessages[currentChat]) chatMessages[currentChat] = [];
    chatMessages[currentChat].push(savedMsg);
    renderMessages(currentChat);
  } catch (e) {
    console.error('Ошибка отправки:', e);
  }
}

// === ОБРАБОТЧИКИ КНОПОК ===
sendBtn.onclick = () => {
  const text = input.value.trim();
  if (text) {
    sendMessage(text);
    input.value = '';
  }
};

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendBtn.click();
});

// === ИНДИКАТОР ПЕЧАТИ ===
let typingTimer;
input.addEventListener('input', () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'typing', user: currentUser }));
  }
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => {
    // Можно отправить сигнал "остановил печатать"
  }, 2000);
});

// === ЗАГРУЗКА ФАЙЛОВ ===
document.getElementById('attachBtn').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch('/upload', {
      method: 'POST',
      body: formData
    });
    const data = await res.json();
    if (data.fileUrl) {
      sendMessage(data.fileUrl, true);
    }
  } catch (e) {
    console.error('Ошибка загрузки:', e);
  }
});

// === КЛИК ПО ЧАТУ ===
document.querySelectorAll('.chat-item').forEach(el => {
  el.onclick = () => {
    const id = el.dataset.chat;
    const name = el.textContent.trim();
    openChat(id, name);
  };
});

// === ВЫХОД ===
logoutBtn.onclick = () => {
  currentUser = null;
  currentChat = null;
  if (ws) ws.close();
  chatScreen.classList.remove('active');
  loginScreen.classList.add('active');
  chatList.classList.remove('hidden');
  messagesDiv.classList.add('hidden');
  document.getElementById('footer').classList.add('hidden');
};
</script>
</body>
</html>
