<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой Мессенджер</title>
  <style>
    body { font-family: Arial; background: #0e1621; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; flex-direction: column; }
    .container { background: #17212b; padding: 30px; border-radius: 16px; width: 300px; }
    input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: none; background: #2b3b4a; color: #fff; }
    button { width: 100%; padding: 10px; background: #2b5278; color: #fff; border: none; border-radius: 8px; cursor: pointer; margin-top: 5px; }
    button:hover { background: #3a6b94; }
    #message { margin-top: 10px; color: #7e9bb5; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔐 Вход / Регистрация</h2>
    <input type="text" id="username" placeholder="Логин">
    <input type="password" id="password" placeholder="Пароль">
    <button id="loginBtn">Войти</button>
    <button id="registerBtn">Зарегистрироваться</button>
    <div id="message"></div>
  </div>

  <script>
    const username = document.getElementById('username');
    const password = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const registerBtn = document.getElementById('registerBtn');
    const message = document.getElementById('message');

    async function sendRequest(url, data) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      return res.json();
    }

    loginBtn.onclick = async () => {
      const result = await sendRequest('/login', {
        username: username.value,
        password: password.value
      });
      message.textContent = result.message || result.error;
      message.style.color = result.success ? '#4caf50' : '#f44336';
    };

    registerBtn.onclick = async () => {
      const result = await sendRequest('/register', {
        username: username.value,
        password: password.value
      });
      message.textContent = result.message || result.error;
      message.style.color = result.success ? '#4caf50' : '#f44336';
    };
  </script>
</body>
</html>
